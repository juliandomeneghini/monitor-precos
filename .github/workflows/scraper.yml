name: Coleta diaria de precos

on:
  schedule:
    - cron: "0 9 * * *"      # todo dia 09:00 UTC (06:00 em Brasília)
  workflow_dispatch:          # permite rodar manualmente pelo botao

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Rodar scraper
        run: python scraper.py

      - name: Commitar o banco atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/precos.db
          git diff --quiet && git diff --staged --quiet || git commit -m "Coleta automatica $(date -u +'%Y-%m-%d')"
          git push